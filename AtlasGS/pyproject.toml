[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "AtlasGS"
version = "0.1.0"
description = "Research code for multi-modal MRI super-resolution with Gaussian splatting."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib",
  "nibabel",
  "numpy",
  "Pillow",
  "scikit-image",
  "scipy",
]

[project.optional-dependencies]
train = ["torch"]

[tool.setuptools.packages.find]
include = ["atlasgs*"]
